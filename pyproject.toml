[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bw-converter"
version = "0.1.0"
description = "Batch image conversion to black-and-white modes with several algorithms."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Student Programmer" },
]
keywords = ["image-processing", "black-white", "pillow", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.7",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.1",
    "furo>=2024.8.6",
    "interrogate>=1.7.0",
    "matplotlib>=3.8.0",
    "mypy>=1.10.0",
    "poethepoet>=0.27.0",
    "pyinstaller>=6.6.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "sphinx>=7.3.0",
    "sphinx-rtd-theme>=2.0.0",
    "twine>=5.1.0",
]

[project.scripts]
bw-converter = "bw_converter.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/bw_converter"]

[tool.poe.tasks.test]
cmd = "pytest"
help = "Run the pytest test suite."

[tool.poe.tasks.cov]
cmd = "pytest --cov=bw_converter --cov-report=term-missing --cov-fail-under=100"
help = "Run tests with coverage and require 100% coverage."

[tool.poe.tasks.lint]
cmd = "ruff check ."
help = "Check code style and common bugs with Ruff."

[tool.poe.tasks.format]
cmd = "ruff format ."
help = "Format Python code with Ruff."

[tool.poe.tasks.typecheck]
cmd = "mypy src"
help = "Run static type checking with mypy."

[tool.poe.tasks.docs]
cmd = "sphinx-build -b html docs docs/_build/html"
help = "Build HTML documentation with Sphinx."

[tool.poe.tasks.docs-check]
cmd = "sphinx-build -W --keep-going -b html docs docs/_build/html"
help = "Build documentation strictly and fail on Sphinx warnings."

[tool.poe.tasks.docstrings]
cmd = "interrogate src/bw_converter --fail-under=95"
help = "Check docstring coverage with interrogate."

[tool.poe.tasks.build]
cmd = "python -m build"
help = "Build source distribution and wheel packages."

[tool.poe.tasks.check]
sequence = ["lint", "typecheck", "docstrings", "docs-check", "cov"]
help = "Run all quality checks used before submission."

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
]

[tool.coverage.run]
branch = true
source = ["bw_converter"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-module = false
ignore-nested-functions = false
ignore-private = false
ignore-property-decorators = false
ignore-semiprivate = false
fail-under = 95
exclude = ["docs", "tests", "benchmarks", "dist"]
verbose = 1

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "D",
    "ANN",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "PL",
]
ignore = [
    # Russian educational README/docs explain user workflow better than forcing
    # every test and Sphinx helper to repeat obvious module docstrings.
    "D100",
    "D104",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D102", "D103", "ANN201", "PLR2004"]
"benchmarks/**" = ["D103", "PLR2004"]
"docs/conf.py" = ["D100"]

[tool.ruff.lint.pylint]
max-args = 8
