[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bw-converter"
version = "0.1.0"
description = "Batch image conversion to black-and-white modes with several algorithms."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Student Programmer" },
]
keywords = ["image-processing", "black-white", "pillow", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.7",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.1",
    "furo>=2024.8.6",
    "matplotlib>=3.8.0",
    "mypy>=1.10.0",
    "poethepoet>=0.27.0",
    "pyinstaller>=6.6.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "sphinx>=7.3.0",
    "sphinx-rtd-theme>=2.0.0",
    "twine>=5.1.0",
]

[project.scripts]
bw-converter = "bw_converter.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/bw_converter"]

[tool.poe.tasks]
test = "pytest"
cov = "pytest --cov=bw_converter --cov-report=term-missing"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src"
docs = "sphinx-build -b html docs docs/_build/html"
build = "python -m build"
check = ["lint", "typecheck", "test"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
]

[tool.coverage.run]
branch = true
source = ["bw_converter"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "N",
    "D",
    "ANN",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "PL",
]
ignore = [
    # Russian educational README/docs explain user workflow better than forcing
    # every test and Sphinx helper to repeat obvious module docstrings.
    "D100",
    "D104",
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D102", "D103", "ANN201", "PLR2004"]
"benchmarks/**" = ["D103", "PLR2004"]
"docs/conf.py" = ["D100"]

[tool.ruff.lint.pylint]
max-args = 8
